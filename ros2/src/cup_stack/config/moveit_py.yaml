/**:
  ros__parameters:
    planning_scene_monitor_options:
      name: "planning_scene_monitor"
      robot_description: "robot_description"
      joint_state_topic: "/dsr01/joint_states"
      attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
      publish_planning_scene_topic: "/moveit_cpp/publish_planning_scene"
      monitored_planning_scene_topic: "/moveit_cpp/monitored_planning_scene"
      wait_for_initial_state_timeout: 10.0

    planning_pipelines:
      pipeline_names: ["ompl", "pilz_industrial_motion_planner", "chomp", "ompl_rrt_star"]

    plan_request_params:
      planning_attempts: 1
      planning_pipeline: ompl
      max_velocity_scaling_factor: 0.1
      max_acceleration_scaling_factor: 0.1

    ompl_rrtc:
      plan_request_params:
        planning_attempts: 1
        planning_pipeline: ompl
        planner_id: "RRTConnectkConfigDefault"
        max_velocity_scaling_factor: 1.0
        max_acceleration_scaling_factor: 1.0
        planning_time: 1.0

    ompl_rrt_star:
      plan_request_params:
        planning_attempts: 1
        planning_pipeline: ompl_rrt_star
        planner_id: "RRTstarkConfigDefault"
        max_velocity_scaling_factor: 1.0
        max_acceleration_scaling_factor: 1.0
        planning_time: 1.5

    pilz_lin:
      plan_request_params:
        planning_attempts: 1
        planning_pipeline: pilz_industrial_motion_planner
        planner_id: "PTP"
        max_velocity_scaling_factor: 0.1
        max_acceleration_scaling_factor: 0.1
        planning_time: 0.8

    chomp:
      plan_request_params:
        planning_attempts: 1
        planning_pipeline: chomp
        max_velocity_scaling_factor: 1.0
        max_acceleration_scaling_factor: 1.0
        planning_time: 1.5

    # The Doosan emulator keeps converging its joint_states for a few ms after
    # the FollowJointTrajectory controller declares SUCCEEDED, so the next
    # move's planned start can deviate ~0.02-0.03 rad from the measured state by
    # execution time. MoveIt's default 0.01 rad start tolerance then rejects the
    # trajectory ("Invalid Trajectory: start point deviates from current robot
    # state more than 0.01"), aborting a pyramid_step *after* the grasp -> the
    # executor returns HOME and retries, re-gripping the same cup (the "double
    # pick"). 0.1 rad absorbs the sim settle lag; on real hardware the arm is
    # already settled when the next move plans, so a looser bound never trips.
    # This key overrides the MoveItConfigsBuilder default because moveit_py.yaml
    # is loaded after moveit_config.to_dict() in skill_api.launch.py.
    trajectory_execution:
      allowed_start_tolerance: 0.1
